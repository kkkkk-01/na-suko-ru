;; ==========================================================
;; PJSIP Configuration - ナースコールシステム Phase3（実機通話）
;;
;; 設計:
;;   - 利用者端末 = M5StickS3 等の実機（素のSIP/UDP + G.711）
;;       内線 1001-1050 / endpoint名 = 内線番号
;;   - 職員端末   = スマホ/PCブラウザ（WebRTC: SIP over WebSocket）
;;       内線 2001-2015
;;   - DB(devices.sip_username/sip_password) と本ファイルの
;;     資格情報は migration 003 で一致させている
;;   - パスワードは開発用デフォルト。施設運用では必ず変更
;;     （docs/VOICE_CALL_SETUP.md 参照）
;; ==========================================================

;; --- トランスポート ---

; UDP（ESP32実機・SIPクライアント用）
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; TCP
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; WebSocket（職員ブラウザWebRTC用。nginx/APIの /sip-ws からプロキシされる）
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

;; --- テンプレート ---

; 利用者実機テンプレート（ESP32/M5StickS3: 素のSIP + G.711）
; ESP32はDTLS/ICEが重いため WebRTC は使わない（業界標準構成）
[esp32-template](!)
type=endpoint
context=nursecall
disallow=all
allow=ulaw
allow=alaw
direct_media=no          ; RTPは必ずAsterisk経由（NAT/検知を単純化）
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
dtmf_mode=rfc4733

; 職員ブラウザテンプレート（WebRTC over WebSocket）
[webrtc-template](!)
type=endpoint
context=nursecall
disallow=all
; ulaw優先: ESP32側(G.711)と同一コーデックにして変換(トランスコード)を無くす
; → 施設PCのCPU負荷最小・音質劣化なし。PCMUはWebRTC必須コーデックなので全ブラウザ対応
allow=ulaw
allow=alaw
webrtc=yes               ; DTLS-SRTP / ICE / rtcp-mux / AVPF を一括有効化
dtls_auto_generate_cert=yes
dtls_verify=no
direct_media=no
force_rport=yes
rewrite_contact=yes

; AORテンプレート
[single-reg-aor](!)
type=aor
max_contacts=1
remove_existing=yes
default_expiration=300

[multi-reg-aor](!)
type=aor
max_contacts=2
remove_existing=yes
default_expiration=300

;; ==========================================================
;; 利用者実機端末（内線 1001-1010）
;; M5StickS3 は sip_username=内線番号 で REGISTER する
;; ==========================================================

[1001](esp32-template)
auth=1001-auth
aors=1001

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=res1001_dev

[1001](single-reg-aor)

[1002](esp32-template)
auth=1002-auth
aors=1002

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=res1002_dev

[1002](single-reg-aor)

[1003](esp32-template)
auth=1003-auth
aors=1003

[1003-auth]
type=auth
auth_type=userpass
username=1003
password=res1003_dev

[1003](single-reg-aor)

;; ==========================================================
;; 職員ブラウザ端末（内線 2001-2005）
;; 職員Web画面(JsSIP)が wss(/sip-ws) 経由で REGISTER する
;; ==========================================================

[2001](webrtc-template)
auth=2001-auth
aors=2001

[2001-auth]
type=auth
auth_type=userpass
username=2001
password=staff2001_dev

[2001](multi-reg-aor)

[2002](webrtc-template)
auth=2002-auth
aors=2002

[2002-auth]
type=auth
auth_type=userpass
username=2002
password=staff2002_dev

[2002](multi-reg-aor)

[2003](webrtc-template)
auth=2003-auth
aors=2003

[2003-auth]
type=auth
auth_type=userpass
username=2003
password=staff2003_dev

[2003](multi-reg-aor)

[2004](webrtc-template)
auth=2004-auth
aors=2004

[2004-auth]
type=auth
auth_type=userpass
username=2004
password=staff2004_dev

[2004](multi-reg-aor)

[2005](webrtc-template)
auth=2005-auth
