;; ==========================================================
;; Dialplan - ナースコールシステム Phase3（実機通話）
;;
;; 通話フロー（施設運用の基本形）:
;;   1. 利用者が M5StickS3 のボタンを押す
;;      → 実機は REST /calls/request を叩く（音声はまだ発生しない）
;;   2. 職員スマホに着信表示（Socket.IO + FCM）
;;   3. 職員が「応答」を押す
;;      → 職員ブラウザ(JsSIP, 内線2xxx)が利用者実機(内線1xxx)へ発信
;;   4. M5StickS3 は自動応答 → 双方向通話開始
;;
;; つまり「音声呼は常に 職員→利用者 方向」。
;; 利用者実機からの直接ダイヤル（1xxx→2xxx）も予備経路として残す。
;; ==========================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
; API サーバーのURL（通話イベント通知用）
API_URL=http://api:3001/api/v1
API_KEY=nursecall_api_key_dev

;; --- メインコンテキスト ---
[nursecall]

; ============================================
; 職員 → 利用者実機（2xxx が 1xxx へ発信）: 基本経路
; 利用者側(M5StickS3)は自動応答するので即通話になる
; ============================================
exten => _1XXX,1,NoOp(=== Staff answer call: ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(CDR(userfield)=nursecall)
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"sip_dialing","caller":"${CALLERID(num)}","callee":"${EXTEN}","channel":"${CHANNEL}"}')
 same => n,Dial(PJSIP/${EXTEN},20,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?answered:noanswer)
 same => n(answered),NoOp(SIP call answered)
 same => n,Hangup()
 same => n(noanswer),NoOp(SIP call failed: ${DIALSTATUS})
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"sip_failed","caller":"${CALLERID(num)}","callee":"${EXTEN}","status":"${DIALSTATUS}","channel":"${CHANNEL}"}')
 same => n,Hangup()

; ============================================
; 利用者実機 → 職員（1xxx が 2xxx へ発信）: 予備経路
; （通常はREST呼出→職員発信だが、直接ダイヤルも受ける）
; ============================================
exten => _2XXX,1,NoOp(=== Resident direct call: ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Set(CALL_START=${EPOCH})
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"ringing","caller":"${CALLERID(num)}","callee":"${EXTEN}","channel":"${CHANNEL}"}')
 same => n,Dial(PJSIP/${EXTEN},30,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?answered:noanswer)
 same => n(answered),NoOp(Call answered)
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"answered","caller":"${CALLERID(num)}","callee":"${EXTEN}","channel":"${CHANNEL}"}')
 same => n,Hangup()
 same => n(noanswer),NoOp(Call not answered: ${DIALSTATUS})
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"missed","caller":"${CALLERID(num)}","callee":"${EXTEN}","status":"${DIALSTATUS}","channel":"${CHANNEL}"}')
 same => n,Hangup()

; --- テスト用エコー（9999にかけると自分の声が返る。実機の音声疎通確認用） ---
exten => 9999,1,NoOp(=== Echo Test from ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; --- テスト用トーン再生（8888: スピーカー出力のみの確認） ---
exten => 8888,1,NoOp(=== Tone Test ===)
 same => n,Answer()
 same => n,Playtones(440+880/1000,0/500)
 same => n,Wait(5)
 same => n,StopPlaytones()
 same => n,Hangup()

; --- 通話終了ハンドラ ---
exten => h,1,NoOp(=== Call Hangup: ${CHANNEL} Duration: ${CDR(billsec)}s ===)
 same => n,System(curl -s -m 3 -X POST ${API_URL}/calls/asterisk/event -H "Content-Type: application/json" -H "X-API-Key: ${API_KEY}" -d '{"event":"ended","caller":"${CALLERID(num)}","channel":"${CHANNEL}","duration":"${CDR(billsec)}","disposition":"${CDR(disposition)}"}')
